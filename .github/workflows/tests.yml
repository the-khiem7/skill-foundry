name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The suite renders the template and runs each generated suite, including
    # its POSIX kit, so it runs on every operating system a skill runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the suite
        run: uvx --from "pytest>=8,<10" --with pyyaml --with "copier>=9,<10" pytest tests/ -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx --from "ruff>=0.6,<1" ruff check
      - name: Format
        run: uvx --from "ruff>=0.6,<1" ruff format --check
