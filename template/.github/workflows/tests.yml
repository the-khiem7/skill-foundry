name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Shell kits claim POSIX sh and awk only: Ubuntu runs them under dash and
    # mawk, macOS under BWK awk, Windows under Git for Windows sh and gawk.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the suite
        run: uvx --from "pytest>=8,<10" --with pyyaml pytest tests/ -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx --from "ruff>=0.6,<1" ruff check
      - name: Format
        run: uvx --from "ruff>=0.6,<1" ruff format --check
